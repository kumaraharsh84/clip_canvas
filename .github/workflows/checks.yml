name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # --ignore-scripts: no Electron download and no native rebuild. The
      # checks below load plain JS from src/; nothing here needs Electron.
      - name: Install dev tools
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Classification regression suite
        run: node test/verify-classify.js

      - name: Clipboard watcher
        run: node test/verify-clipwatch.js

      - name: Image protocol stays inside storage
        run: node test/verify-asset-protocol.js

      - name: Time canvas layout invariants
        run: node test/verify-timecanvas-2d.js --clips=20000

      - name: Committed bundles match their sources
        run: |
          node src/renderer/canvas/build.js src/renderer/timecanvas.bundle.js
          node src/renderer/canvas/build.js demo/timecanvas.bundle.js
          git diff --exit-code -- src/renderer/timecanvas.bundle.js demo/timecanvas.bundle.js
