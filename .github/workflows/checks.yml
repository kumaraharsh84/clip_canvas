name: checks

# Pushes to main, and every pull request -- not every push, or a branch with
# an open pull request is checked twice.
on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run before it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no Electron download and no native rebuild. The
      # checks below load plain JS from src/; nothing here needs Electron.
      - name: Install dev tools
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # Classification, layout, clipboard watcher, image protocol, shortcut
      # rules: the same list `npm test` runs locally, kept in package.json.
      - name: Checks on plain Node
        run: npm test

      - name: Time canvas layout invariants at 20,000 clips
        run: node test/verify-timecanvas-2d.js --clips=20000

      - name: Committed bundle matches its sources
        run: npm run bundle:check

  # The checks that need Electron itself: the database layer (better-sqlite3
  # is built for Electron's Node) and the whole app end to end, on a database
  # of synthetic clips. On Windows, because ClipCanvas is a Windows app.
  app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A full install this time: it downloads Electron, and the postinstall
      # step fetches better-sqlite3 built for it.
      - name: Install
        run: npm ci

      - name: Database layer
        run: npm run test:db

      - name: The app, end to end
        run: npm run verify:app -- --synthetic
