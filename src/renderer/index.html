<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data: clip-asset:;
               connect-src clip-asset:;">
<title>ClipCanvas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">ClipCanvas</div>

  <label class="field">
    <span>Workspace</span>
    <select id="workspace"></select>
  </label>

  <label class="field">
    <span>Board</span>
    <select id="board"><option value="">All boards</option></select>
  </label>

  <label class="field">
    <span>Show</span>
    <select id="filter">
      <option value="active">Active</option>
      <option value="starred">Starred</option>
      <option value="pinned">Pinned</option>
      <option value="archived">Archived</option>
      <option value="trash">Trash</option>
      <option value="all">All</option>
    </select>
  </label>

  <input id="search" type="search" placeholder="Search as you type…  ( / )" autocomplete="off">

  <div class="spacer"></div>
  <button id="today" title="Go to today (T)">Today</button>
  <button id="fit" title="Fit everything (F)">Fit</button>
  <button id="reload" title="Reload from database">Reload</button>
  <span id="status"></span>
</header>

<main id="stage">
  <div id="time-container"></div>

  <div id="hint">scroll zoom · drag pan · double-click fly in · right-click fly out · F fit · T today</div>

  <aside id="info">
    <div id="info-path"></div>
    <div id="info-title"></div>
    <div id="info-meta"></div>
    <div id="info-cats"></div>
    <div id="hud"></div>
  </aside>

  <div id="legend"></div>

  <aside id="details" hidden>
    <div class="details-head">
      <span id="d-type" class="pill"></span>
      <span id="d-when"></span>
      <button id="d-close" title="Close (Esc)">×</button>
    </div>
    <input id="d-title" placeholder="Untitled clip">
    <div class="details-actions">
      <button id="d-copy">Copy back</button>
      <button id="d-star">Star</button>
      <button id="d-pin">Pin</button>
      <button id="d-archive">Archive</button>
      <button id="d-delete" class="danger">Delete</button>
    </div>
    <div id="d-bodywrap"></div>
    <div id="d-meta" class="meta"></div>
  </aside>

  <div id="results" hidden></div>
  <div id="empty" hidden></div>

  <div id="timeline"></div>
</main>

<script src="timecanvas.bundle.js"></script>
<script src="renderer.js"></script>
</body>
</html>
